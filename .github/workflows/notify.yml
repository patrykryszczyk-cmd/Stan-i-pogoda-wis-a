name: Hydro & Weather Alert

on:
  schedule:
    # Uruchomienie co 30 minut (48 razy na dobę)
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja bibliotek i wirtualnej przeglądarki
        run: |
          pip install requests matplotlib playwright
          playwright install chromium --with-deps

      - name: Uruchomienie skryptu i alertu
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python alert.py

      - name: Zapis historii i stanu operacyjnego do repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add raport.png history.csv last_level.txt morning_state.txt rain_state.txt || true
          git commit -m "Aktualizacja bazy i stanu operacyjnego [skip ci]" || echo "Brak zmian do zapisu"
          git push
