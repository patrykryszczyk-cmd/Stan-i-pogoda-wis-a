name: Hydro & Weather Alert

on:
  schedule:
    # Uruchomienie co 30 minut (48 razy na dobę)
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja bibliotek
        run: pip install requests matplotlib

      - name: Uruchomienie generatora i wysyłka alertu
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python alert.py

      - name: Zapis historii pomiarów do repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.csv rain_state.txt || true
          git commit -m "Aktualizacja historii [skip ci]" || echo "Brak zmian"
          git push
